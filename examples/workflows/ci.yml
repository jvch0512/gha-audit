name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: some-org/setup-thing@0123456789abcdef0123456789abcdef01234567
      - name: Title safely
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE"
      - run: make test
